[package]
name = "ilias-tui"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal UI for ILIAS (HSLU) with Keycloak / Switch edu-ID login"
license = "MIT"

[dependencies]
color-eyre = "0.6.5"
cookie_store = "0.22.1"
crossterm = "0.29.0"
directories = "6.0.0"
headless_chrome = "1.0.22"
jiff = "0.2"
percent-encoding = "2.3.2"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", features = ["blocking", "brotli", "cookies", "gzip", "multipart"] }
reqwest_cookie_store = "0.10.0"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
url = "2.5.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
